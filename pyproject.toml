[project]
name = "bastion-agent-governance"
version = "0.2.0"
description = "Runtime governance control plane for AI agents: policy-enforcing MCP gateway, human approvals, kill switch, audit, evidence packs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Vishnu Chivukula" }]
dependencies = [
    "anthropic",
    "en-core-web-sm",
    "faker>=40.54.0",
    "fastapi>=0.163.1",
    "honcho>=2.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "playwright>=1.65.2",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.67.0",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
bastion = "bastion.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pypdf>=7.1.0",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S102", "S307"]  # S102/S307: no exec()/eval()

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/bastion"]
branch = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
