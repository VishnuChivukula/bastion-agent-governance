[project]
name = "bastion-agent-governance"
version = "0.1.0"
description = "Runtime governance control plane for AI agents: policy-enforcing MCP gateway, human approvals, kill switch, audit, evidence packs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Vishnu Chivukula" }]
dependencies = [
    "anthropic",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
bastion = "bastion.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bastion"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S102", "S307"]  # S102/S307: no exec()/eval()

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/bastion"]
branch = true
