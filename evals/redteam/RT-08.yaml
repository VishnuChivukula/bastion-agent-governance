id: RT-08
suite: redteam
category: arg-smuggling
title: new_limit sent as the string "60000"
expected: deny invalid_arguments; limit unchanged
steps:
- call:
    tool: update_credit_limit
    args:
      customer_id: C-0021
      current_limit: 40000
      reason: customer request ref 8812
      new_limit: '60000'
  expect:
    status: DENIED
    reason: invalid_arguments
- expect_limit:
    C-0021: 40000
