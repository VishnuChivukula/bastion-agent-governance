# Default policy template for agents signed off at tier `high` (FR-05).
# A template is a starting posture: budgets, incident rules and NO tool rules, so every tool
# call is denied (default deny) until an owner adds reviewed rules as a new policy version.
# An agent-specific policy at policies/<agent-id>.yaml takes precedence over the template.
agent: __AGENT_ID__
version_note: "tier template: high"
budgets:
  max_tool_calls_per_session: 30
  max_tokens_per_session: 200000
  max_cost_usd_per_day: 5.0
incident_rules:
  - id: IR-T1
    when: "deny_count_10m >= 3"
    severity: medium
  - id: IR-T2
    when: "category == 'exfiltration'"
    severity: high
    on_incident: kill
rules: []
