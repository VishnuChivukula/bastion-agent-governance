# gitleaks configuration: the default rules, plus one narrowly scoped exception.
[extend]
useDefault = true

[allowlist]
description = """Commit 92ea8f3 stored each LLM fixture's own sha256 fingerprint in a field named
"key", which the generic-api-key rule flags. It is a content hash, not a credential. The field
has since been renamed to "fixture_sha256"; only that one historical commit is exempted."""
commits = ["92ea8f3f0a4c9b9f92d49e81f48c7b3f9e9caf3a"]
